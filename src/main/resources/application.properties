spring.application.name=Slotwise
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/slotwise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.port=8081
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
